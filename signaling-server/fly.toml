# Fly.io configuration for @karosync/signaling
# Deploy from repository root:
#   fly deploy --config signaling-server/fly.toml --dockerfile signaling-server/Dockerfile

app = "karosync-signaling"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  MAX_CLIENTS_PER_ROOM = "8"
  HEARTBEAT_INTERVAL_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
